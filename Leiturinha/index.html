<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Leiturinha - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #1B5E20; color: #1B5E20; font-weight: bold; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <!-- 1. MASTER PASSWORD SCREEN -->
    <div id="master-gate" class="flex items-center justify-center min-h-screen animate-fade-in">
        <div class="bg-white p-12 rounded-[3rem] shadow-2xl w-full max-w-md border border-gray-100 text-center">
            <div class="bg-green-100 w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-6 text-green-700 text-4xl shadow-inner">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="text-3xl font-black text-green-900 mb-2">Painel Admin</h1>
            <p class="text-gray-400 text-sm mb-8 font-medium">Acesso Restrito</p>
            <input type="password" id="master-pass" placeholder="Digite a senha mestre" class="w-full p-5 rounded-2xl border-2 border-gray-100 focus:outline-none focus:border-green-500 bg-gray-50 text-center text-xl font-bold mb-6 transition">
            <button onclick="checkMaster()" class="w-full bg-green-700 text-white p-5 rounded-2xl font-black text-lg hover:bg-green-800 transition shadow-xl shadow-green-100">ENTRAR</button>
        </div>
    </div>

    <!-- 2. MAIN ADMIN PANEL -->
    <div id="admin-panel" class="hidden animate-fade-in">
        <!-- TOP NAV -->
        <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="bg-green-700 text-white p-2 rounded-lg"><i class="fas fa-magic"></i></div>
                    <span class="font-black text-green-900 text-xl tracking-tighter uppercase">Leiturinha Admin</span>
                </div>
                <div id="active-user-badge" class="hidden items-center gap-3 bg-green-50 px-4 py-2 rounded-2xl border border-green-100">
                    <div class="text-right">
                        <p class="text-[8px] font-black text-green-600 uppercase tracking-widest leading-none">Gerenciando Agora</p>
                        <span id="selected-user-name" class="text-green-900 font-black text-xs"></span>
                    </div>
                    <button onclick="deselectUser()" class="text-red-400 hover:text-red-600 text-xs"><i class="fas fa-times-circle"></i></button>
                </div>
                <button onclick="location.reload()" class="text-gray-400 hover:text-gray-600 text-sm font-bold">SAIR</button>
            </div>
        </nav>

        <!-- SUB NAV TABS -->
        <div class="bg-white border-b sticky top-20 z-40">
            <div class="max-w-7xl mx-auto px-8 flex gap-10">
                <button onclick="switchTab('tab-users')" class="tab-btn py-5 active-tab transition-all flex items-center gap-2" id="btn-tab-users"><i class="fas fa-chalkboard-teacher"></i> Professores</button>
                <button id="btn-tab-data" onclick="switchTab('tab-data')" class="tab-btn py-5 text-gray-400 transition-all flex items-center gap-2 opacity-50" disabled><i class="fas fa-database"></i> Dados do Usuário</button>
            </div>
        </div>

        <main class="max-w-7xl mx-auto p-8">

            <!-- TAB: USERS LIST -->
            <div id="tab-users" class="tab-content active space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <!-- Create User Form -->
                    <div class="lg:col-span-4">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-100 sticky top-48">
                            <h2 class="text-xl font-black mb-8 flex items-center gap-2" id="user-form-title"><i class="fas fa-user-plus text-green-700"></i> Novo Professor</h2>
                            <div class="space-y-5">
                                <div>
                                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Nome Completo</label>
                                    <input type="text" id="u-nome" class="w-full p-4 rounded-xl border-2 border-gray-50 focus:border-green-500 focus:outline-none bg-gray-50 font-bold transition">
                                </div>
                                <div>
                                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">E-mail de Acesso</label>
                                    <input type="email" id="u-email" class="w-full p-4 rounded-xl border-2 border-gray-50 focus:border-green-500 focus:outline-none bg-gray-50 font-bold transition">
                                </div>
                                <div>
                                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">Senha (Texto Simples)</label>
                                    <input type="text" id="u-pass" class="w-full p-4 rounded-xl border-2 border-gray-50 focus:border-green-500 focus:outline-none bg-gray-50 font-bold transition">
                                </div>
                                <button onclick="saveUser()" class="w-full bg-green-700 text-white p-4 rounded-xl font-black hover:bg-green-800 shadow-lg transition">SALVAR CONTA</button>
                                <button id="btn-cancel-edit-user" onclick="clearUserForm()" class="hidden w-full text-gray-400 text-xs font-bold py-2">CANCELAR EDIÇÃO</button>
                            </div>
                        </div>
                    </div>
                    <!-- Users List -->
                    <div class="lg:col-span-8">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-gray-100">
                            <div class="flex justify-between items-center mb-8">
                                <h2 class="text-2xl font-black">Professores Cadastrados</h2>
                                <span id="count-users" class="bg-gray-100 text-gray-500 px-4 py-1 rounded-full text-[10px] font-black uppercase">0 CONTAS</span>
                            </div>
                            <div id="users-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Users injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB: USER DATA (Students, Texts, etc) -->
            <div id="tab-data" class="tab-content space-y-12">

                <!-- Inner Nav for User Data -->
                <div class="flex gap-4 p-2 bg-gray-100 rounded-2xl w-fit mx-auto">
                    <button onclick="switchSubTab('sub-alunos')" class="sub-tab-btn bg-white px-6 py-2 rounded-xl font-black text-xs shadow-sm shadow-gray-200" id="btn-sub-alunos">ALUNOS</button>
                    <button onclick="switchSubTab('sub-textos')" class="sub-tab-btn px-6 py-2 rounded-xl font-black text-xs text-gray-400" id="btn-sub-textos">TEXTOS</button>
                    <button onclick="switchSubTab('sub-palavras')" class="sub-tab-btn px-6 py-2 rounded-xl font-black text-xs text-gray-400" id="btn-sub-palavras">PALAVRAS</button>
                    <button onclick="switchSubTab('sub-resultados')" class="sub-tab-btn px-6 py-2 rounded-xl font-black text-xs text-gray-400" id="btn-sub-resultados">RESULTADOS</button>
                </div>

                <!-- SUB-TAB: ALUNOS -->
                <div id="sub-alunos" class="sub-tab-content">
                    <div class="bg-white p-10 rounded-[2.5rem] border border-gray-100 shadow-xl max-w-4xl mx-auto">
                        <h3 class="text-xl font-black mb-8 text-center uppercase tracking-widest text-green-900">Gerenciar Estudantes</h3>
                        <div class="flex gap-2 mb-8 bg-gray-50 p-2 rounded-2xl border border-gray-100 focus-within:border-green-500 transition">
                            <input type="text" id="new-aluno" placeholder="Nome completo do aluno..." class="flex-1 p-4 bg-transparent border-none focus:outline-none font-bold">
                            <button onclick="addAluno()" class="bg-green-700 text-white px-8 rounded-xl font-black hover:bg-green-800">ADICIONAR</button>
                        </div>
                        <div id="alunos-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <!-- Alunos -->
                        </div>
                    </div>
                </div>

                <!-- SUB-TAB: TEXTOS -->
                <div id="sub-textos" class="sub-tab-content hidden">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div class="lg:col-span-4 space-y-4">
                            <div class="bg-white p-6 rounded-3xl shadow-lg border">
                                <h4 class="font-black mb-4">Lista de Histórias</h4>
                                <button onclick="clearTextoForm()" class="w-full mb-4 bg-green-50 text-green-700 p-3 rounded-xl border-2 border-dashed border-green-200 hover:bg-green-100 font-bold">+ CRIAR</button>
                                <div id="textos-list" class="space-y-2 max-h-[400px] overflow-y-auto pr-2"></div>
                            </div>
                        </div>
                        <div class="lg:col-span-8">
                            <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border">
                                <input type="text" id="txt-titulo" placeholder="Título" class="w-full p-4 rounded-xl border mb-4 text-lg font-black">
                                <textarea id="txt-corpo" rows="8" placeholder="Texto..." class="w-full p-4 rounded-xl border mb-6 resize-none font-medium"></textarea>
                                <div id="perguntas-container" class="space-y-6"></div>
                                <button onclick="saveTexto()" class="w-full bg-green-700 text-white p-5 rounded-2xl font-black mt-8 hover:bg-green-800 shadow-xl">SALVAR TEXTO</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SUB-TAB: PALAVRAS -->
                <div id="sub-palavras" class="sub-tab-content hidden">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div class="lg:col-span-4 space-y-4">
                            <div class="bg-white p-6 rounded-3xl shadow-lg border">
                                <h4 class="font-black mb-4">Bibliotecas</h4>
                                <button onclick="clearPalavrasForm()" class="w-full mb-4 bg-purple-50 text-purple-700 p-3 rounded-xl border-2 border-dashed border-purple-200 hover:bg-purple-100 font-bold">+ NOVA LISTA</button>
                                <div id="palavras-list" class="space-y-2 max-h-[400px] overflow-y-auto pr-2"></div>
                            </div>
                        </div>
                        <div class="lg:col-span-8">
                            <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border">
                                <input type="text" id="pal-titulo" placeholder="Nome da Lista" class="w-full p-4 rounded-xl border mb-4 text-lg font-black">
                                <textarea id="pal-conteudo" rows="6" placeholder="palavra1, palavra2..." class="w-full p-4 rounded-xl border mb-6 resize-none"></textarea>
                                <button onclick="saveListaP()" class="w-full bg-purple-700 text-white p-5 rounded-2xl font-black hover:bg-purple-800">SALVAR LISTA</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SUB-TAB: RESULTADOS -->
                <div id="sub-resultados" class="sub-tab-content hidden">
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 text-[10px] font-black uppercase text-gray-400">
                                <tr>
                                    <th class="p-6">Estudante</th>
                                    <th class="p-6">Tipo</th>
                                    <th class="p-6">Conteúdo</th>
                                    <th class="p-6 text-center">Precisão</th>
                                    <th class="p-6 text-center">PPM</th>
                                    <th class="p-6">Data</th>
                                    <th class="p-6"></th>
                                </tr>
                            </thead>
                            <tbody id="resultados-table" class="text-sm"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>

        <footer class="text-center py-12 text-gray-400 text-[10px] font-black uppercase tracking-widest">
            Desenvolvido por Eronildo Tavares ©
        </footer>
    </div>

    <!-- FIREBASE MODULES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAsdIi-Zz9txnnPPWU0hBS7AVoyHSGuSRY",
            authDomain: "leiturinha-b8d11.firebaseapp.com",
            projectId: "leiturinha-b8d11",
            storageBucket: "leiturinha-b8d11.firebasestorage.app",
            messagingSenderId: "822571000970",
            appId: "1:822571000970:web:d83d1c312789f6888af973"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeUID = null; // The professor being managed
        let currentEditUserId = null;
        let currentEditingTextoId = null;
        let currentEditingPalId = null;

        // --- AUTH ADMIN ---
        window.checkMaster = () => {
            if(document.getElementById('master-pass').value === '311201') {
                document.getElementById('master-gate').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadUsers();
            } else { alert("Senha mestre incorreta!"); }
        };

        // --- PROFESSORS MANAGEMENT ---
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
                document.getElementById('count-users').innerText = `${list.length} CONTAS`;
                renderUsers(list);
            });
        }

        window.saveUser = async () => {
            const nome = document.getElementById('u-nome').value.trim();
            const email = document.getElementById('u-email').value.trim().toLowerCase();
            const pass = document.getElementById('u-pass').value.trim();
            if(!nome || !email || !pass) return alert("Preencha todos os dados da conta!");

            const id = currentEditUserId || self.crypto.randomUUID();
            await setDoc(doc(db, "users", id), { nome, email, senha: pass }, { merge: true });
            alert("✓ Professor salvo!");
            clearUserForm();
        };

        window.editUser = (id, nome, email, pass) => {
            currentEditUserId = id;
            document.getElementById('user-form-title').innerHTML = '<i class="fas fa-user-edit text-orange-600"></i> Editando Professor';
            document.getElementById('u-nome').value = nome;
            document.getElementById('u-email').value = email;
            document.getElementById('u-pass').value = pass;
            document.getElementById('btn-cancel-edit-user').classList.remove('hidden');
        };

        window.clearUserForm = () => {
            currentEditUserId = null;
            document.getElementById('user-form-title').innerHTML = '<i class="fas fa-user-plus text-green-700"></i> Novo Professor';
            document.getElementById('u-nome').value = ""; document.getElementById('u-email').value = ""; document.getElementById('u-pass').value = "";
            document.getElementById('btn-cancel-edit-user').classList.add('hidden');
        };

        window.deleteUser = async (id) => {
            if(confirm("ATENÇÃO: Isso removerá o professor E TODOS OS DADOS dele (alunos, textos, resultados). Continuar?")) {
                await deleteDoc(doc(db, "users", id));
            }
        };

        window.selectUser = (id, nome) => {
            activeUID = id;
            document.getElementById('selected-user-name').innerText = nome;
            document.getElementById('active-user-badge').classList.replace('hidden', 'flex');
            const dataBtn = document.getElementById('btn-tab-data');
            dataBtn.disabled = false;
            dataBtn.classList.remove('text-gray-400', 'opacity-50');
            switchTab('tab-data');
            initUserSync();
        };

        window.deselectUser = () => {
            activeUID = null;
            document.getElementById('active-user-badge').classList.replace('flex', 'hidden');
            const dataBtn = document.getElementById('btn-tab-data');
            dataBtn.disabled = true;
            dataBtn.classList.add('text-gray-400', 'opacity-50');
            switchTab('tab-users');
        };

        function renderUsers(list) {
            document.getElementById('users-list').innerHTML = list.map(u => `
                <div class="bg-white p-6 rounded-3xl border-2 border-gray-50 shadow-sm flex flex-col gap-4 group hover:border-green-200 transition">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-black text-green-900">${u.nome}</h3>
                            <p class="text-xs text-gray-400 font-bold">${u.email}</p>
                            <p class="text-[10px] text-orange-400 mt-1 uppercase">Senha: <b>${u.senha}</b></p>
                        </div>
                        <button onclick="editUser('${u.id}', '${u.nome}', '${u.email}', '${u.senha}')" class="text-gray-300 hover:text-orange-500"><i class="fas fa-cog"></i></button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="selectUser('${u.id}', '${u.nome}')" class="flex-1 bg-green-50 text-green-700 py-3 rounded-xl font-black text-[10px] uppercase hover:bg-green-700 hover:text-white transition">Gerenciar Dados</button>
                        <button onclick="deleteUser('${u.id}')" class="bg-red-50 text-red-300 px-4 rounded-xl hover:text-red-600 transition"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // --- SCOPED DATA MANAGEMENT (STUDENTS, TEXTS, ETC) ---
        let userSnapshots = [];
        function initUserSync() {
            // Clear previous listeners
            userSnapshots.forEach(unsub => unsub());
            userSnapshots = [];

            // Sync Alunos
            userSnapshots.push(onSnapshot(doc(db, "users", activeUID), (d) => {
                if(d.exists()) renderAlunos(d.data().alunos || []);
            }));
            // Sync Textos
            userSnapshots.push(onSnapshot(collection(db, "users", activeUID, "histTextos"), (s) => {
                renderTextos(s.docs.map(doc => doc.data()));
            }));
            // Sync Palavras
            userSnapshots.push(onSnapshot(collection(db, "users", activeUID, "bibPalavras"), (s) => {
                renderPalavras(s.docs.map(doc => doc.data()));
            }));
            // Sync Resultados
            userSnapshots.push(onSnapshot(collection(db, "users", activeUID, "listResults"), (s) => {
                renderResultados(s.docs.map(doc => doc.data()));
            }));
        }

        // --- ACTIONS FOR SCOPED DATA ---
        window.addAluno = async () => {
            const name = document.getElementById('new-aluno').value.trim();
            if(!name || !activeUID) return;
            const ref = doc(db, "users", activeUID);
            const snap = await getDoc(ref);
            const list = snap.exists() ? (snap.data().alunos || []) : [];
            if(!list.includes(name)) await setDoc(ref, { alunos: [...list, name].sort() }, { merge: true });
            document.getElementById('new-aluno').value = "";
        };
        window.removeAluno = async (nm) => {
            const ref = doc(db, "users", activeUID);
            const snap = await getDoc(ref);
            await setDoc(ref, { alunos: (snap.data().alunos || []).filter(a => a !== nm) }, { merge: true });
        };
        function renderAlunos(l) {
            document.getElementById('alunos-list').innerHTML = l.map(a => `
                <div class="bg-gray-50 p-4 rounded-2xl flex justify-between items-center group">
                    <span class="font-black text-gray-700">${a}</span>
                    <button onclick="removeAluno('${a}')" class="text-red-200 hover:text-red-500 opacity-0 group-hover:opacity-100"><i class="fas fa-times-circle"></i></button>
                </div>
            `).join('');
        }

        // Textos Logic
        window.saveTexto = async () => {
            const t = document.getElementById('txt-titulo').value.trim();
            const c = document.getElementById('txt-corpo').value.trim();
            if(!t || !c) return alert("Título e corpo vazios!");
            const qArr = [];
            for(let i=0; i<3; i++) {
                const questao = document.getElementById(`q-${i}-text`).value;
                const opcoes = [0,1,2,3].map(j => document.getElementById(`q-${i}-opt-${j}`).value);
                const correta = parseInt(document.querySelector(`input[name="correct-${i}"]:checked`)?.value || 0);
                qArr.push({ questao, opcoes, correta });
            }
            const id = currentEditingTextoId || self.crypto.randomUUID();
            await setDoc(doc(db, "users", activeUID, "histTextos", id), { id, titulo: t, texto: c, perguntas: qArr });
            alert("✓ Texto salvo!"); clearTextoForm();
        };
        function renderTextos(l) {
            document.getElementById('textos-list').innerHTML = l.map(t => `
                <div class="flex items-center gap-2 group">
                    <div onclick="editTexto('${t.id}', '${t.titulo.replace(/'/g,"")}', '${t.texto.replace(/'/g,"").replace(/\n/g,"\\n")}', '${encodeURIComponent(JSON.stringify(t.perguntas))}')" class="flex-1 p-4 bg-gray-50 rounded-2xl border group-hover:border-green-400 cursor-pointer transition">
                        <span class="font-black text-xs block truncate">${t.titulo}</span>
                    </div>
                    <button onclick="deleteTexto('${t.id}')" class="text-red-200 hover:text-red-500 p-2 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
            `).join('');
        }

        window.deleteTexto = async (id) => {
            if(confirm("Deseja excluir esta história permanentemente?")) {
                await deleteDoc(doc(db, "users", activeUID, "histTextos", id));
                alert("✓ História removida!");
            }
        };
        window.clearTextoForm = () => {
            currentEditingTextoId = null; document.getElementById('txt-titulo').value = ""; document.getElementById('txt-corpo').value = "";
            [0,1,2].forEach(i => { document.getElementById(`q-${i}-text`).value = ""; [0,1,2,3].forEach(j => document.getElementById(`q-${i}-opt-${j}`).value = "") });
        };
        window.editTexto = (id, tit, txt, qs) => {
            currentEditingTextoId = id; const qL = JSON.parse(decodeURIComponent(qs));
            document.getElementById('txt-titulo').value = tit; document.getElementById('txt-corpo').value = txt;
            qL.forEach((q, i) => {
                document.getElementById(`q-${i}-text`).value = q.questao;
                q.opcoes.forEach((o, j) => document.getElementById(`q-${i}-opt-${j}`).value = o);
                document.getElementById(`check-${i}-${q.correta}`).checked = true;
            });
        };

        // Palavras Logic
        window.saveListaP = async () => {
            const tit = document.getElementById('pal-titulo').value.trim();
            const cor = document.getElementById('pal-conteudo').value.trim();
            const list = cor.split(/[, \s\n]+/).filter(p => p !== "");
            const id = currentEditingPalId || self.crypto.randomUUID();
            await setDoc(doc(db, "users", activeUID, "bibPalavras", id), { id, titulo: tit, palavras: list });
            alert("✓ Lista salva!"); clearPalavrasForm();
        };
        function renderPalavras(l) {
            document.getElementById('palavras-list').innerHTML = l.map(p => `
                <div class="flex items-center gap-2 group">
                    <div onclick="editPal('${p.id}', '${p.titulo}', '${encodeURIComponent(JSON.stringify(p.palavras))}')" class="flex-1 p-4 bg-purple-50 rounded-2xl border group-hover:border-purple-400 cursor-pointer transition">
                        <span class="font-black text-xs block truncate">${p.titulo}</span>
                    </div>
                    <button onclick="deleteListaP('${p.id}')" class="text-red-200 hover:text-red-500 p-2 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
            `).join('');
        }

        window.deleteListaP = async (id) => {
            if(confirm("Deseja excluir esta lista de palavras permanentemente?")) {
                await deleteDoc(doc(db, "users", activeUID, "bibPalavras", id));
                alert("✓ Lista removida!");
            }
        };
        window.editPal = (id, tit, list) => {
            currentEditingPalId = id; document.getElementById('pal-titulo').value = tit;
            document.getElementById('pal-conteudo').value = JSON.parse(decodeURIComponent(list)).join(", ");
        };
        window.clearPalavrasForm = () => { currentEditingPalId = null; document.getElementById('pal-titulo').value = ""; document.getElementById('pal-conteudo').value = ""; };

        // Resultados Logic
        function renderResultados(l) {
            const sorted = l.sort((a,b) => (b.data||'').localeCompare(a.data||''));
            document.getElementById('resultados-table').innerHTML = sorted.map(r => `
                <tr class="border-b border-gray-50">
                    <td class="p-6 font-black">${r.aluno}</td>
                    <td class="p-6 text-[10px] font-black text-blue-600 uppercase">${r.tipo}</td>
                    <td class="p-6 text-xs text-gray-500">${r.conteudo}</td>
                    <td class="p-6 text-center font-black text-green-700">${r.precisao}%</td>
                    <td class="p-6 text-center font-black">${r.ppm}</td>
                    <td class="p-6 text-[9px] text-gray-400 font-mono">${r.data}</td>
                    <td class="p-6"><button onclick="deleteRes('${r.id}')" class="text-red-200 hover:text-red-500"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
        }
        window.deleteRes = async (id) => { if(confirm("Apagar?")) await deleteDoc(doc(db, "users", activeUID, "listResults", id)); };

        // Perguntas generation
        function genQ() {
            let h = '';
            for(let i=0; i<3; i++) {
                h += `<div class="bg-gray-50 p-6 rounded-2xl border border-gray-200 space-y-4">
                    <div class="text-[10px] font-black text-green-700 uppercase tracking-widest">Questão ${i+1}</div>
                    <input type="text" id="q-${i}-text" placeholder="Pergunta" class="w-full p-3 rounded-xl border focus:outline-none focus:border-green-500">
                    <div class="grid grid-cols-2 gap-3">
                        ${[0,1,2,3].map(j => `
                            <div class="flex items-center gap-2 bg-white p-2 rounded-xl border">
                                <input type="radio" name="correct-${i}" value="${j}" id="check-${i}-${j}" class="accent-green-700">
                                <input type="text" id="q-${i}-opt-${j}" placeholder="Opção ${j+1}" class="flex-1 text-xs focus:outline-none">
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }
            document.getElementById('perguntas-container').innerHTML = h;
        }
        genQ();

        // --- UI UTILS ---
        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active-tab'); b.classList.add('text-gray-400'); });
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active-tab'); document.getElementById('btn-' + id).classList.remove('text-gray-400');
        };
        window.switchSubTab = (id) => {
            document.querySelectorAll('.sub-tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.sub-tab-btn').forEach(b => { b.classList.replace('bg-white', 'bg-transparent'); b.classList.replace('shadow-sm', 'shadow-none'); b.classList.replace('text-gray-900', 'text-gray-400'); });
            document.getElementById(id).classList.remove('hidden');
            const b = document.getElementById('btn-' + id);
            b.classList.replace('bg-transparent', 'bg-white'); b.classList.replace('shadow-none', 'shadow-sm'); b.classList.replace('text-gray-400', 'text-gray-900');
        };
    </script>
</body>
</html>
