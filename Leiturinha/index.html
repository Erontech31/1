<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Gerenciamento de Fluência</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Tela de Autenticação */
        #auth-section {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        #app-section {
            display: none; /* Escondido até o usuário logar */
        }
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8f0fe;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            text-align: left;
        }
        input[type="email"], input[type="password"], input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .btn-submit {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #1557b0;
        }
        .btn-secondary {
            background-color: #5f6368;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background-color: #3c4043;
        }
        .btn-logout {
            background-color: #ea4335;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout:hover { background-color: #c9302c; }
        ul {
            list-style-type: none;
            padding: 0;
            text-align: left;
        }
        li {
            background: #f8f9fa;
            margin-top: 8px;
            padding: 12px;
            border-left: 4px solid #1a73e8;
            border-radius: 4px;
        }
        .text-body {
            margin-top: 5px;
            font-size: 0.9em;
            color: #555;
            white-space: pre-wrap;
        }
        .actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .btn-edit {
            background-color: #fbbc05;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete {
            background-color: #ea4335;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-edit:hover { background-color: #e0a800; }
        .btn-delete:hover { background-color: #c9302c; }
        .cancel-edit {
            display: none;
            background-color: #6c757d;
        }
        .cancel-edit.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-section" class="container">
        <div class="card">
            <h2>Acessar Painel</h2>
            <form id="form-auth">
                <label for="auth-email">E-mail</label>
                <input type="email5" id="auth-email" placeholder="seu@email.com" required style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
                
                <label for="auth-senha">Senha</label>
                <input type="password" id="auth-senha" placeholder="Sua senha" required style="width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
                
                <button type="submit" class="btn-submit" id="btn-login">Entrar</button>
                <button type="button" class="btn-submit btn-secondary" id="btn-registrar">Criar Conta Nova</button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL (SÓ APARECE LOGADO) -->
    <div id="app-section" class="container">
        <div class="user-bar">
            <span>Logado como: <strong id="user-email-display"></strong></span>
            <button class="btn-logout" id="btn-sair">Sair</button>
        </div>

        <h1>Gerenciamento de Fluência</h1>

        <!-- Seção de Textos -->
        <div class="card">
            <h2>Cadastrar/Editar Texto</h2>
            <form id="form-texto">
                <label for="titulo">Título do Texto</label>
                <input type="text" id="titulo" placeholder="Ex: A Raposa e as Uvas" required>
                
                <label for="corpo">Corpo do Texto</label>
                <textarea id="corpo" rows="6" placeholder="Digite o texto completo aqui..." required></textarea>
                
                <button type="submit" class="btn-submit" id="btn-salvar-texto">Salvar Texto</button>
                <button type="button" class="btn-submit cancel-edit" id="btn-cancelar-texto">Cancelar Edição</button>
            </form>
            <h3>Textos Cadastrados</h3>
            <ul id="lista-textos"></ul>
        </div>

        <!-- Seção de Palavras -->
        <div class="card">
            <h2>Cadastrar/Editar Palavra-chave</h2>
            <form id="form-palavra">
                <label for="palavra">Palavra</label>
                <input type="text" id="palavra" placeholder="Ex: Fluência" required>
                
                <button type="submit" class="btn-submit" id="btn-salvar-palavra">Adicionar Palavra</button>
                <button type="button" class="btn-submit cancel-edit" id="btn-cancelar-palavra">Cancelar</button>
            </form>
            <h3>Palavras Cadastradas</h3>
            <ul id="lista-palavras"></ul>
        </div>

        <!-- Seção de Alunos -->
        <div class="card">
            <h2>Cadastrar/Editar Aluno</h2>
            <form id="form-aluno">
                <label for="nome">Nome do Aluno</label>
                <input type="text" id="nome" placeholder="Ex: João Silva" required>
                
                <button type="submit" class="btn-submit" id="btn-salvar-aluno">Adicionar Aluno</button>
                <button type="button" class="btn-submit cancel-edit" id="btn-cancelar-aluno">Cancelar</button>
            </form>
            <h3>Alunos Cadastrados</h3>
            <ul id="lista-alunos"></ul>
        </div>
    </div>

    <!-- Firebase SDK (Modular com Auth e Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Suas credenciais do projeto Leiturinha
        const firebaseConfig = {
            apiKey: "AIzaSyBIpH8AhGAjoPNjel7QFHz85XqHUwdb7_Q",
            authDomain: "leiturinha-b8d11.firebaseapp.com",
            projectId: "leiturinha-b8d11",
            storageBucket: "leiturinha-b8d11.firebasestorage.app",
            messagingSenderId: "822571000970",
            appId: "1:822571000970:web:322b80d68a7e60b93af973",
            measurementId: "G-3TC7HY0LK2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const userEmailDisplay = document.getElementById('user-email-display');
        
        let unsubscribeTextos = null;
        let unsubscribePalavras = null;
        let unsubscribeAlunos = null;

        // Monitorar Estado de Autenticação (Login / Logout)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuário logado
                authSection.style.display = 'none';
                appSection.style.display = 'block';
                userEmailDisplay.innerText = user.email;

                // Carregar dados específicos deste usuário (baseado no UID)
                carregarDadosUsuario(user.uid);
            } else {
                // Deslogado
                authSection.style.display = 'block';
                appSection.style.display = 'none';
                
                // Cancelar escuta dos dados anteriores
                if (unsubscribeTextos) unsubscribeTextos();
                if (unsubscribePalavras) unsubscribePalavras();
                if (unsubscribeAlunos) unsubscribeAlunos();
            }
        });

        // Ações de Login e Cadastro
        const formAuth = document.getElementById('form-auth');
        const btnRegistrar = document.getElementById('btn-registrar');

        formAuth.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const senha = document.getElementById('auth-senha').value.trim();
            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (error) {
                alert("Erro ao entrar: " + error.message);
            }
        });

        btnRegistrar.addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value.trim();
            const senha = document.getElementById('auth-senha').value.trim();
            if(!email || !senha) {
                alert("Preencha e-mail e senha para cadastrar.");
                return;
            }
            try {
                await createUserWithEmailAndPassword(auth, email, senha);
                alert("Conta criada com sucesso e login efetuado!");
            } catch (error) {
                alert("Erro ao criar conta: " + error.message);
            }
        });

        document.getElementById('btn-sair').addEventListener('click', () => {
            signOut(auth);
        });

        // Função para carregar os dados isolados na árvore do usuário (`users/{uid}/...`)
        function carregarDadosUsuario(uid) {
            // ==========================================
            // 1. TEXTOS
            // ==========================================
            const formTexto = document.getElementById('form-texto');
            const listaTextos = document.getElementById('lista-textos');
            const btnSalvarTexto = document.getElementById('btn-salvar-texto');
            const btnCancelarTexto = document.getElementById('btn-cancelar-texto');
            let editTextoId = null; 
            let textosCache = {};   

            function limparFormTexto() {
                formTexto.reset();
                editTextoId = null;
                btnSalvarTexto.innerText = "Salvar Texto";
                btnCancelarTexto.classList.remove('active');
            }
            btnCancelarTexto.onclick = limparFormTexto;

            formTexto.onsubmit = async (e) => {
                e.preventDefault();
                const titulo = document.getElementById('titulo').value.trim();
                const corpo = document.getElementById('corpo').value.trim();
                try {
                    if (editTextoId) {
                        await updateDoc(doc(db, "users", uid, "textos", editTextoId), { titulo, corpo });
                    } else {
                        await addDoc(collection(db, "users", uid, "textos"), { titulo, corpo });
                    }
                    limparFormTexto();
                } catch (error) {
                    alert("Erro ao salvar texto: " + error.message);
                }
            };

            unsubscribeTextos = onSnapshot(collection(db, "users", uid, "textos"), (snapshot) => {
                listaTextos.innerHTML = '';
                textosCache = {};
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    textosCache[id] = data; 
                    listaTextos.innerHTML += `
                        <li>
                            <strong>${data.titulo}</strong>
                            <div class="text-body">${data.corpo}</div>
                            <div class="actions">
                                <button class="btn-edit btn-edit-texto" data-id="${id}">Editar</button>
                                <button class="btn-delete btn-delete-texto" data-id="${id}">Apagar</button>
                            </div>
                        </li>`;
                });
            });

            listaTextos.onclick = async (e) => {
                const id = e.target.dataset.id;
                if (!id) return;
                if (e.target.classList.contains('btn-delete-texto')) {
                    if (confirm("Apagar este texto?")) {
                        await deleteDoc(doc(db, "users", uid, "textos", id));
                    }
                } else if (e.target.classList.contains('btn-edit-texto')) {
                    const data = textosCache[id];
                    document.getElementById('titulo').value = data.titulo;
                    document.getElementById('corpo').value = data.corpo;
                    editTextoId = id;
                    btnSalvarTexto.innerText = "Atualizar Texto";
                    btnCancelarTexto.classList.add('active');
                }
            };

            // ==========================================
            // 2. PALAVRAS
            // ==========================================
            const formPalavra = document.getElementById('form-palavra');
            const listaPalavras = document.getElementById('lista-palavras');
            const btnSalvarPalavra = document.getElementById('btn-salvar-palavra');
            const btnCancelarPalavra = document.getElementById('btn-cancelar-palavra');
            let editPalavraId = null;
            let palavrasCache = {};

            function limparFormPalavra() {
                formPalavra.reset();
                editPalavraId = null;
                btnSalvarPalavra.innerText = "Adicionar Palavra";
                btnCancelarPalavra.classList.remove('active');
            }
            btnCancelarPalavra.onclick = limparFormPalavra;

            formPalavra.onsubmit = async (e) => {
                e.preventDefault();
                const palavra = document.getElementById('palavra').value.trim();
                try {
                    if (editPalavraId) {
                        await updateDoc(doc(db, "users", uid, "palavras", editPalavraId), { palavra });
                    } else {
                        await addDoc(collection(db, "users", uid, "palavras"), { palavra });
                    }
                    limparFormPalavra();
                } catch (error) {
                    alert("Erro ao salvar palavra: " + error.message);
                }
            };

            unsubscribePalavras = onSnapshot(collection(db, "users", uid, "palavras"), (snapshot) => {
                listaPalavras.innerHTML = '';
                palavrasCache = {};
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    palavrasCache[id] = data;
                    listaPalavras.innerHTML += `
                        <li>
                            ${data.palavra}
                            <div class="actions">
                                <button class="btn-edit btn-edit-palavra" data-id="${id}">Editar</button>
                                <button class="btn-delete btn-delete-palavra" data-id="${id}">Apagar</button>
                            </div>
                        </li>`;
                });
            });

            listaPalavras.onclick = async (e) => {
                const id = e.target.dataset.id;
                if (!id) return;
                if (e.target.classList.contains('btn-delete-palavra')) {
                    if (confirm("Apagar esta palavra?")) {
                        await deleteDoc(doc(db, "users", uid, "palavras", id));
                    }
                } else if (e.target.classList.contains('btn-edit-palavra')) {
                    document.getElementById('palavra').value = palavrasCache[id].palavra;
                    editPalavraId = id;
                    btnSalvarPalavra.innerText = "Atualizar Palavra";
                    btnCancelarPalavra.classList.add('active');
                }
            };

            // ==========================================
            // 3. ALUNOS
            // ==========================================
            const formAluno = document.getElementById('form-aluno');
            const listaAlunos = document.getElementById('lista-alunos');
            const btnSalvarAluno = document.getElementById('btn-salvar-aluno');
            const btnCancelarAluno = document.getElementById('btn-cancelar-aluno');
            let editAlunoId = null;
            let alunosCache = {};

            function limparFormAluno() {
                formAluno.reset();
                editAlunoId = null;
                btnSalvarAluno.innerText = "Adicionar Aluno";
                btnCancelarAluno.classList.remove('active');
            }
            btnCancelarAluno.onclick = limparFormAluno;

            formAluno.onsubmit = async (e) => {
                e.preventDefault();
                const nome = document.getElementById('nome').value.trim();
                try {
                    if (editAlunoId) {
                        await updateDoc(doc(db, "users", uid, "alunos", editAlunoId), { nome });
                    } else {
                        await addDoc(collection(db, "users", uid, "alunos"), { nome });
                    }
                    limparFormAluno();
                } catch (error) {
                    alert("Erro ao salvar aluno: " + error.message);
                }
            };

            unsubscribeAlunos = onSnapshot(collection(db, "users", uid, "alunos"), (snapshot) => {
                listaAlunos.innerHTML = '';
                alunosCache = {};
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    alunosCache[id] = data;
                    listaAlunos.innerHTML += `
                        <li>
                            ${data.nome}
                            <div class="actions">
                                <button class="btn-edit btn-edit-aluno" data-id="${id}">Editar</button>
                                <button class="btn-delete btn-delete-aluno" data-id="${id}">Apagar</button>
                            </div>
                        </li>`;
                });
            });

            listaAlunos.onclick = async (e) => {
                const id = e.target.dataset.id;
                if (!id) return;
                if (e.target.classList.contains('btn-delete-aluno')) {
                    if (confirm("Apagar este aluno?")) {
                        await deleteDoc(doc(db, "users", uid, "alunos", id));
                    }
                } else if (e.target.classList.contains('btn-edit-aluno')) {
                    document.getElementById('nome').value = alunosCache[id].nome;
                    editAlunoId = id;
                    btnSalvarAluno.innerText = "Atualizar Aluno";
                    btnCancelarAluno.classList.add('active');
                }
            };
        }
    </script>
</body>
</html>
