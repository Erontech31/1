<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Music Room</title>
    <!-- Bibliotecas -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- jsmediatags para extrair a capa do MP3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <!-- Ícones -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Fundo Animado */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: liquidBackground 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes liquidBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Efeito de Vidro Líquido e Refração (Container Principal) */
        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(25px) saturate(250%) contrast(110%) hue-rotate(5deg);
            -webkit-backdrop-filter: blur(25px) saturate(250%) contrast(110%) hue-rotate(5deg);
            border-top: 2px solid rgba(255, 255, 255, 0.7);
            border-left: 2px solid rgba(255, 255, 255, 0.6);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.25), 
                inset 0 4px 18px rgba(255, 255, 255, 0.6), 
                inset 0 -4px 18px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            overflow: hidden;
            min-height: 400px;
            transition: all 0.5s ease;
        }

        /* Animação de Brilho Líquido Interno (Caustics) */
        .container::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 40%);
            animation: liquidFlow 12s infinite linear;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes liquidFlow {
            0% { transform: rotate(0deg) scale(1) translate(0%, 0%); }
            33% { transform: rotate(120deg) scale(1.1) translate(5%, -5%); }
            66% { transform: rotate(240deg) scale(0.9) translate(-5%, 5%); }
            100% { transform: rotate(360deg) scale(1) translate(0%, 0%); }
        }

        /* Telas (Transições suaves) */
        .screen {
            position: absolute;
            top: 30px; left: 30px; right: 30px;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95) translateY(20px);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }
        
        .screen.active {
            position: relative;
            top: 0; left: 0; right: 0;
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        h1, h2, h3 { margin-top: 0; text-align: center; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        
        /* Botões e Inputs */
        button, input[type="text"] {
            width: 100%; padding: 15px; margin: 10px 0;
            border-radius: 16px; 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.05));
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.6);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white; font-size: 16px; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(15px) saturate(150%);
            -webkit-backdrop-filter: blur(15px) saturate(150%);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1), inset 0 2px 6px rgba(255,255,255,0.6);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        button:hover { 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.15));
            transform: translateY(-2px) scale(1.01); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2), inset 0 3px 8px rgba(255,255,255,0.8); 
        }
        input::placeholder { color: rgba(255,255,255,0.9); text-shadow: none; }
        input[type="text"] { text-align: center; font-size: 24px; letter-spacing: 5px; outline: none; }
        
        /* Botão Voltar Menor */
        .back-btn {
            width: auto; padding: 10px 15px; margin: 0 0 20px 0;
            font-size: 14px; float: left; display: flex; align-items: center; gap: 8px;
            border-radius: 12px;
        }
        .clearfix::after { content: ""; clear: both; display: table; }

        /* Lista de Músicas */
        .playlist { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; margin: 15px 0; }
        .playlist::-webkit-scrollbar { width: 6px; }
        .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 10px; }
        .playlist li {
            padding: 12px 15px; margin-bottom: 8px; border-radius: 14px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(10px) saturate(120%);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1), inset 0 1px 3px rgba(255,255,255,0.2);
            font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .playlist li:hover { background: rgba(255,255,255,0.25); transform: scale(1.02); }
        .playlist li.active { background: rgba(255,255,255,0.35); border-left: 4px solid #fff; }

        /* Card do Player */
        #player-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(0, 0, 0, 0.15));
            border-radius: 20px; padding: 15px;
            margin-top: 15px; display: none; opacity: 0; transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2), inset 0 2px 10px rgba(255,255,255,0.3);
        }
        #player-card.visible { display: block; opacity: 1; transform: translateY(0); }
        
        .cover-art {
            width: 100px; height: 100px; border-radius: 12px;
            object-fit: cover; margin: 0 auto 10px; display: block;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4); background: #333;
        }
        .song-title { text-align: center; font-size: 1.1rem; margin-bottom: 10px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        /* Controles do Player */
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .ctrl-btn {
            background: none; border: none; font-size: 20px; color: white;
            width: auto; padding: 8px; cursor: pointer; transition: transform 0.2s;
            box-shadow: none; border-radius: 50%;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); box-shadow: none;}
        .play-btn { font-size: 32px; }

        /* Volume */
        .volume-container { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
        input[type="range"] {
            -webkit-appearance: none; height: 6px; background: rgba(255,255,255,0.3);
            border-radius: 5px; outline: none; padding: 0; margin: 0; width: 100%; border: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            background: #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* QR Code & Status na Tela Inicial */
        .room-info { text-align: center; margin-bottom: 15px; }
        .room-code { font-size: 32px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; }
        #qrcode img { border-radius: 12px; border: 4px solid rgba(255,255,255,0.9); box-shadow: 0 8px 25px rgba(0,0,0,0.25); }
        
        .status-badge { 
            display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 12px; 
            background: linear-gradient(135deg, rgba(0,0,0,0.4), rgba(0,0,0,0.1)); 
            border-top: 1px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.1); 
        }
        
        #btn-join-client { background: linear-gradient(135deg, rgba(40, 167, 69, 0.8), rgba(40, 167, 69, 0.4)); margin-top: 20px; }
        #btn-join-client:hover { background: linear-gradient(135deg, rgba(40, 167, 69, 0.9), rgba(40, 167, 69, 0.5)); }
    </style>
</head>
<body>

<div class="glass container">
    
    <!-- TELA 1: INÍCIO -->
    <div id="screen-home" class="screen active">
        <h1><i class="fas fa-music"></i> Vibes Sync</h1>
        
        <div class="room-info">
            <div style="font-size: 14px; opacity: 0.9; text-shadow: 0 1px 2px rgba(0,0,0,0.2);">Seu Código para Nova Sala:</div>
            <div class="room-code" id="home-room-code">----</div>
        </div>

        <div id="ip-config" style="display:none; font-size: 12px; text-align: center; margin-bottom:10px;">
            <p style="margin:0 0 5px 0; text-shadow: 0 1px 2px rgba(0,0,0,0.2);">Para o celular ler o QR Code, digite seu IP</p>
            <input type="text" id="host-ip-input" placeholder="IP (Ex: 192.168.0.x)" style="font-size: 12px; padding: 8px; width: 60%; letter-spacing: normal; margin-top:0;">
            <button onclick="updateQRCode()" style="width: 30%; padding: 8px; font-size: 12px; margin-top:0;">Atualizar</button>
        </div>

        <div id="qrcode"></div>
        
        <button onclick="createRoom()"><i class="fas fa-play-circle"></i> Iniciar Minha Sala</button>
        
        <div style="margin: 20px 0; text-align: center; font-size: 14px; opacity: 0.9; text-shadow: 0 1px 2px rgba(0,0,0,0.2);">OU ENTRAR EM OUTRA SALA</div>
        
        <input type="text" id="join-code-input" placeholder="CÓDIGO (Ex: 1234)" maxlength="4">
        <button onclick="joinRoomFromInput()"><i class="fas fa-sign-in-alt"></i> Entrar na Sala</button>
    </div>

    <!-- TELA 2: HOST (CRIADOR DA SALA) -->
    <div id="screen-host" class="screen">
        <div class="clearfix">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Voltar</button>
            <div class="status-badge" id="host-status" style="float: right; margin-top: 10px;">Aguardando...</div>
        </div>

        <!-- BOTÃO PARA CARREGAR MÚSICAS DE 0 A 10 AUTOMATICAMENTE -->
        <button onclick="loadDefaultPlaylist()" style="background: linear-gradient(135deg, rgba(231, 60, 126, 0.6), rgba(35, 166, 213, 0.6));">
            <i class="fas fa-sync-alt"></i> Carregar Músicas (0.mp3 a 10.mp3)
        </button>

        <!-- Lista de Músicas Carregadas -->
        <ul class="playlist" id="playlist-ui">
            <li style="justify-content: center; opacity: 0.7; cursor: default;">Clique no botão acima para carregar as músicas</li>
        </ul>

        <!-- CARD DO PLAYER (HOST) -->
        <div id="player-card" class="glass">
            <img src="" id="host-cover" class="cover-art" style="display: none;">
            <div class="song-title" id="host-title">Selecione uma música</div>
            
            <div class="controls">
                <button class="ctrl-btn" onclick="prevTrack()"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn play-btn" onclick="togglePlay()"><i class="fas fa-play" id="host-play-icon"></i></button>
                <button class="ctrl-btn" onclick="nextTrack()"><i class="fas fa-step-forward"></i></button>
            </div>
            
            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="host-volume" min="0" max="1" step="0.01" value="0.5" oninput="changeVolume(this.value)">
                <i class="fas fa-volume-up"></i>
            </div>
        </div>
    </div>

    <!-- TELA 3: CLIENTE (OUVINTE) -->
    <div id="screen-client" class="screen">
        <div class="clearfix">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Sair da Sala</button>
            <div class="status-badge" id="client-status" style="float: right; margin-top: 10px;">Conectando...</div>
        </div>
        
        <button id="btn-join-client" onclick="enableClientAudio()">🎵 Tocar Áudio</button>
        
        <div id="client-player-card" class="glass" style="margin-top: 20px; padding: 20px; text-align: center; display: none;">
            <img src="" id="client-cover" class="cover-art" style="display: none;">
            <div class="song-title" id="client-title" style="margin-top: 15px;">Aguardando música...</div>
            <p style="font-size: 12px; opacity: 0.8; margin-top: 10px;"><i class="fas fa-lock"></i> O criador da sala controla a música.</p>
        </div>
    </div>

</div>

<!-- Áudio Oculto -->
<audio id="core-audio"></audio>

<script>
    let playlist = []; 
    let peer = null;
    let connections = [];
    let isHost = false;
    let preGeneratedRoomCode = "";
    let roomCode = "";
    
    let currentTrackIndex = -1;
    let audio = document.getElementById('core-audio');
    audio.volume = 0.5;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goBack() {
        if (peer) {
            peer.destroy();
            peer = null;
        }
        
        connections = [];
        isHost = false;
        roomCode = "";
        currentTrackIndex = -1;
        
        audio.pause();
        audio.src = "";
        document.getElementById('player-card').classList.remove('visible');
        document.getElementById('client-player-card').style.display = 'none';
        document.getElementById('join-code-input').value = "";
        document.getElementById('btn-join-client').style.display = 'block';
        
        generateInitialCode();
        showScreen('screen-home');
    }

    function generateInitialCode() {
        preGeneratedRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('home-room-code').innerText = preGeneratedRoomCode;
        updateQRCode();
    }

    window.onload = () => {
        generateInitialCode();

        const urlParams = new URLSearchParams(window.location.search);
        const joinCode = urlParams.get('join');
        if(joinCode && joinCode.length === 4) {
            document.getElementById('join-code-input').value = joinCode;
            joinRoomFromInput();
        }
    }

    async function loadDefaultPlaylist() {
        playlist = [];
        const listEl = document.getElementById('playlist-ui');
        listEl.innerHTML = `<li style="justify-content: center; opacity: 0.7; cursor: default;">Carregando músicas (0.mp3 a 10.mp3)...</li>`;
        
        for (let i = 0; i <= 10; i++) {
            const fileName = `${i}.mp3`;
            try {
                const response = await fetch(fileName);
                if (response.ok) {
                    const blob = await response.blob();
                    playlist.push({
                        name: fileName,
                        file: blob,
                        url: URL.createObjectURL(blob)
                    });
                }
            } catch (e) {
                console.log(`Arquivo ${fileName} não encontrado.`);
            }
        }

        renderPlaylist();
    }

    function renderPlaylist() {
        const listEl = document.getElementById('playlist-ui');
        listEl.innerHTML = '';
        
        if (playlist.length === 0) {
            listEl.innerHTML = `<li style="justify-content: center; opacity: 0.7; cursor: default;">Nenhum arquivo (0.mp3 a 10.mp3) encontrado na pasta!</li>`;
            return;
        }

        playlist.forEach((item, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<i class="fas fa-music"></i> ${item.name}`;
            li.onclick = () => playTrack(index);
            listEl.appendChild(li);
        });
    }

    // ==========================================
    // LÓGICA DO HOST
    // ==========================================
    function createRoom() {
        roomCode = preGeneratedRoomCode;
        const peerId = `vibessync-${roomCode}`;
        
        showScreen('screen-host');
        
        peer = new Peer(peerId);
        isHost = true;

        peer.on('open', (id) => {
            updateHostStatus();
        });

        peer.on('connection', (conn) => {
            connections.push(conn);
            updateHostStatus();
            
            conn.on('open', () => {
                if(currentTrackIndex !== -1) {
                    const track = playlist[currentTrackIndex];
                    conn.send({ 
                        type: 'load_track', 
                        fileName: track.name, 
                        fileBlob: track.file,
                        time: audio.currentTime, 
                        playing: !audio.paused,
                        volume: audio.volume
                    });
                }
            });

            conn.on('close', () => {
                connections = connections.filter(c => c !== conn);
                updateHostStatus();
            });
        });

        setupHostAudioEvents();
    }

    function updateHostStatus() {
        document.getElementById('host-status').innerText = `${connections.length} Ouvinte(s)`;
    }

    function updateQRCode() {
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; 
        
        let baseUrl = window.location.href.split('?')[0];
        
        if (baseUrl.includes('localhost') || baseUrl.includes('127.0.0.1')) {
            document.getElementById('ip-config').style.display = 'block';
            const customIp = document.getElementById('host-ip-input').value.trim();
            if(customIp) {
                baseUrl = `http://${customIp}:${window.location.port}${window.location.pathname}`;
            }
        }

        const joinUrl = `${baseUrl}?join=${preGeneratedRoomCode}`;
        new QRCode(qrContainer, {
            text: joinUrl, width: 150, height: 150,
            colorDark: "#222", colorLight: "#fff", correctLevel: QRCode.CorrectLevel.H
        });
    }

    // ==========================================
    // CONTROLES DE ÁUDIO & METADADOS (ID3)
    // ==========================================
    function playTrack(index) {
        if(index < 0 || index >= playlist.length) return;
        currentTrackIndex = index;
        const track = playlist[index];
        
        document.querySelectorAll('.playlist li').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });

        const card = document.getElementById('player-card');
        card.classList.add('visible');
        document.getElementById('host-title').innerText = track.name;
        
        audio.src = track.url;
        audio.play();

        extractCoverArtFromFile(track.file, 'host-cover');
        
        // Envia a música e o arquivo Blob para os ouvintes conectados
        broadcast({ 
            type: 'load_track', 
            fileName: track.name, 
            fileBlob: track.file,
            time: 0,
            playing: true,
            volume: audio.volume
        });
    }

    function togglePlay() {
        if(!audio.src) return;
        if(audio.paused) audio.play();
        else audio.pause();
    }

    function nextTrack() { playTrack((currentTrackIndex + 1) % playlist.length); }
    function prevTrack() { playTrack((currentTrackIndex - 1 + playlist.length) % playlist.length); }
    function changeVolume(val) { audio.volume = val; broadcast({ type: 'volume', val: val }); }

    function setupHostAudioEvents() {
        const playIcon = document.getElementById('host-play-icon');
        audio.addEventListener('play', () => {
            playIcon.classList.replace('fa-play', 'fa-pause');
            broadcast({ type: 'play', time: audio.currentTime });
        });
        audio.addEventListener('pause', () => {
            playIcon.classList.replace('fa-pause', 'fa-play');
            broadcast({ type: 'pause', time: audio.currentTime });
        });
        audio.addEventListener('seeked', () => {
            broadcast({ type: 'time', time: audio.currentTime });
        });
        audio.addEventListener('ended', nextTrack);
    }

    function broadcast(data) {
        connections.forEach(conn => { if (conn.open) conn.send(data); });
    }

    // ==========================================
    // LÓGICA DO CLIENTE
    // ==========================================
    let hostConn = null;

    function joinRoomFromInput() {
        const code = document.getElementById('join-code-input').value.trim();
        if(code.length !== 4) return alert("Digite um código de 4 dígitos!");
        joinRoom(code);
    }

    function joinRoom(code) {
        roomCode = code;
        showScreen('screen-client');
        
        peer = new Peer();
        
        peer.on('open', () => {
            hostConn = peer.connect(`vibessync-${code}`);
            
            hostConn.on('open', () => {
                document.getElementById('client-status').innerText = "✅ Conectado";
                document.getElementById('client-status').style.background = 'rgba(40, 167, 69, 0.5)';
            });

            hostConn.on('data', (data) => {
                switch(data.type) {
                    case 'load_track':
                        document.getElementById('client-player-card').style.display = 'block';
                        document.getElementById('client-title').innerText = data.fileName;
                        
                        const blobUrl = URL.createObjectURL(data.fileBlob);
                        audio.src = blobUrl;
                        audio.currentTime = data.time || 0;
                        audio.volume = data.volume || 0.5;
                        
                        if(data.playing) {
                            audio.play().catch(e => console.log("Aguardando toque no botão de áudio."));
                        }
                        break;
                    case 'play':
                        if(data.time !== undefined) audio.currentTime = data.time;
                        audio.play().catch(e => console.log("Aguardando interação"));
                        break;
                    case 'pause':
                        audio.pause();
                        if(data.time !== undefined) audio.currentTime = data.time;
                        break;
                    case 'time':
                        audio.currentTime = data.time;
                        break;
                    case 'volume':
                        audio.volume = data.val;
                        break;
                }
            });

            hostConn.on('close', () => {
                document.getElementById('client-status').innerText = "❌ Conexão Perdida";
                document.getElementById('client-status').style.background = 'rgba(220, 53, 69, 0.5)';
            });
        });
    }

    function enableClientAudio() {
        document.getElementById('btn-join-client').style.display = 'none';
        audio.play().then(() => { audio.pause(); }).catch(e=>{});
        alert("Áudio liberado! Agora a música do Host vai tocar aqui.");
    }

    // ==========================================
    // EXTRAÇÃO DA CAPA DO MP3 (ID3 TAGS)
    // ==========================================
    function extractCoverArtFromFile(file, imgId) {
        const imgEl = document.getElementById(imgId);
        const jsmediatags = window.jsmediatags;
        
        if(jsmediatags) {
            jsmediatags.read(file, {
                onSuccess: function(tag) {
                    const picture = tag.tags.picture;
                    if (picture) {
                        let base64String = "";
                        for (let i = 0; i < picture.data.length; i++) {
                            base64String += String.fromCharCode(picture.data[i]);
                        }
                        const base64 = "data:" + picture.format + ";base64," + window.btoa(base64String);
                        imgEl.src = base64;
                        imgEl.style.display = 'block';
                    } else {
                        imgEl.style.display = 'none';
                    }
                },
                onError: function(error) {
                    imgEl.style.display = 'none';
                }
            });
        }
    }
</script>
